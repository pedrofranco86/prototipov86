name: Build Pelops APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Publish APK as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pelops-v0.1.0
          name: Pelops Assistant v0.1.0
          body: "Primera compilación de Pelops Assistant. Versión inicial con burbuja, chat, voz e historial local. La IA en la nube aún no está conectada."
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
