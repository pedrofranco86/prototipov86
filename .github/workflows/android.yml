name: Build Pelops APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The Android SDK is preinstalled on GitHub's ubuntu runners
      # (android-actions/setup-android@v3 failed here, so it was removed).
      # Just make sure the platform/build-tools this project needs exist.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.7.3 is incompatible with Gradle 9.x; pin to 8.9
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Publish APK as GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pelops-v0.1.0
          name: Pelops Assistant v0.1.0
          body: "Primera compilación de Pelops Assistant. Versión inicial con burbuja, chat, voz e historial local. La IA en la nube aún no está conectada."
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
